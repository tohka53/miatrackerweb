<header class="fixed inset-x-0 top-0 z-50 bg-white/90 backdrop-blur border-b border-slate-200">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
    <a [routerLink]="['/']" class="flex items-center gap-3">
      <img src="/miatrackerlogo.png" alt="M.I.A Tracker Logo" class="h-9 w-9 object-contain">
      <span class="text-xl font-extrabold text-emerald-800">M.I.A Tracker</span>
    </a>

    <!-- desktop -->
    <nav class="hidden md:flex items-center gap-6 text-sm font-semibold">
      <a [routerLink]="['/']" fragment="features" class="text-slate-700 hover:text-emerald-700">Features</a>
      <a [routerLink]="['/']" fragment="why" class="text-slate-700 hover:text-emerald-700">Why Us</a>
      <a [routerLink]="['/']" fragment="mobile" class="text-slate-700 hover:text-emerald-700">Mobile App</a>
      <a [routerLink]="['/']" fragment="pricing" class="text-slate-700 hover:text-emerald-700">Pricing</a>
      <a [routerLink]="['/']" fragment="contact" class="text-slate-700 hover:text-emerald-700">Contact</a>

      <!-- BOTÓN LOGIN -->
      <a href="/app/" class="px-4 py-2 rounded-xl border-2 border-emerald-700 text-emerald-700 font-semibold hover:bg-emerald-50 transition-colors">
        <i class="fa-solid fa-right-to-bracket mr-2"></i>Login
      </a>

      <a [routerLink]="['/']" fragment="demo" class="px-4 py-2 rounded-xl bg-emerald-700 text-white shadow hover:bg-emerald-800">Request demo</a>
    </nav>

    <!-- mobile toggle -->
    <label for="menu" class="md:hidden p-2 rounded-lg border border-slate-300 cursor-pointer">
      <i class="fa-solid fa-bars"></i>
    </label>
  </div>

  <input id="menu" type="checkbox" class="hidden peer">
  <nav class="md:hidden peer-checked:block hidden border-t border-slate-200 bg-white">
    <div class="px-4 py-3 flex flex-col gap-3 text-sm font-semibold">
      <a [routerLink]="['/']" fragment="features" class="py-2 text-slate-700">Features</a>
      <a [routerLink]="['/']" fragment="why" class="py-2 text-slate-700">Why Us</a>
      <a [routerLink]="['/']" fragment="mobile" class="py-2 text-slate-700">Mobile App</a>
      <a [routerLink]="['/']" fragment="pricing" class="py-2 text-slate-700">Pricing</a>
      <a [routerLink]="['/']" fragment="contact" class="py-2 text-slate-700">Contact</a>

      <!-- BOTÓN LOGIN MOBILE -->
      <a href="/app/" class="py-2 text-center rounded-xl border-2 border-emerald-700 text-emerald-700 font-semibold">
        <i class="fa-solid fa-right-to-bracket mr-2"></i>Login
      </a>

      <a [routerLink]="['/']" fragment="demo" class="py-2 text-center rounded-xl bg-emerald-700 text-white">Request demo</a>
    </div>
  </nav>
</header>
